version = 1
SPDX-PackageName = "a7s-linux-lts"
SPDX-PackageDownloadLocation = "https://github.com/DockSeed/a7s-linux-lts"

# Patches are licensed like the project they patch, whatever SPDX lines the
# files they add carry inside the diff; hence "override".

[[annotations]]
path = "kernel/**"
precedence = "override"
SPDX-FileCopyrightText = "The Linux kernel contributors and the a7s-linux-lts contributors"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "out-of-tree/aic8800/patches/**"
precedence = "override"
SPDX-FileCopyrightText = "AICSemi and the a7s-linux-lts contributors"
SPDX-License-Identifier = "GPL-2.0-only"

# Everything else without an inline header: README, docs, pins, package list and
# the ignore file.
[[annotations]]
path = ["README.md", "docs/**", "pins/**", "container/**", "out-of-tree/**/*.md", "**/series", ".gitignore", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "the a7s-linux-lts contributors"
SPDX-License-Identifier = "GPL-2.0-only OR MIT"

# scripts/lib/series.sh is adapted from the series reader of a7s-build.
[[annotations]]
path = "scripts/lib/series.sh"
precedence = "aggregate"
SPDX-FileCopyrightText = "the a7s-build contributors"
